# Shared tasks. Put machine-specific environment variables in mise.local.toml (git-ignored),
# see mise.local.toml.example.

[tasks.bench]
description = "Install the SDK, build and run the benchmarks (extra args go to JMH)"
run = "./run-benchmarks.sh"

[tasks."sdk:install"]
description = "Install the SDK checkout at $SDK_DIR into ~/.m2"
run = 'mvn -q -f "${SDK_DIR:-../../Unleash/unleash-java-sdk}/pom.xml" install -DskipTests'

[tasks.build]
description = "Build the benchmarks jar against the installed SDK"
run = "mvn -q package"
